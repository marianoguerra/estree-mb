<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>estree-mb playground</title>
    <meta
      name="description"
      content="Parse JavaScript with acorn, round-trip the ESTree JSON through MoonBit and compare the generated code with astring."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%233b5bdb%22/%3E%3Ctext x=%228%22 y=%2212%22 font-size=%2210%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22monospace%22%3E%7B%7D%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.6",
          "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.15?deps=@codemirror/state@6.7.6",
          "@codemirror/language": "https://esm.sh/@codemirror/language@6.13.1?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.15",
          "codemirror": "https://esm.sh/codemirror@6.0.2?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.15,@codemirror/language@6.13.1",
          "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.5?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.15,@codemirror/language@6.13.1",
          "@codemirror/lang-json": "https://esm.sh/@codemirror/lang-json@6.0.2?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.15,@codemirror/language@6.13.1",
          "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6.1.3?deps=@codemirror/state@6.7.6,@codemirror/view@6.43.15,@codemirror/language@6.13.1",
          "acorn": "https://esm.sh/acorn@8.19.0",
          "astring": "https://esm.sh/astring@1.9.0"
        }
      }
    </script>
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <header>
      <h1>estree-mb <span>playground</span></h1>
      <label class="field">
        Library target
        <select id="target">
          <option value="wasm-gc">wasm-gc</option>
          <option value="js">js</option>
        </select>
      </label>
      <span id="timing" class="muted"></span>
      <span id="verdict" class="verdict pending">loading…</span>
      <a class="repo" href="https://github.com/marianoguerra/estree-mb">GitHub</a>
    </header>
    <main>
      <section class="panel" aria-label="Input">
        <div class="toolbar">
          <label class="field">
            Example
            <select id="example"></select>
          </label>
          <label class="field">
            Source type
            <select id="source-type">
              <option value="module">module</option>
              <option value="script">script</option>
            </select>
          </label>
          <span class="muted">parsed with acorn 8.19.0 (no stage 3 syntax)</span>
        </div>
        <div id="editor" class="editor"></div>
        <pre id="parse-error" class="parse-error" hidden></pre>
      </section>
      <section class="panel" aria-label="Output">
        <div class="toolbar tabs" role="tablist">
          <button role="tab" data-tab="json" aria-selected="true">ESTree JSON</button>
          <button role="tab" data-tab="ours" aria-selected="false">MoonBit codegen <span class="mark" data-mark="ours"></span></button>
          <button role="tab" data-tab="astring" aria-selected="false">astring <span class="mark" data-mark="astring"></span></button>
          <label class="field positions" id="positions-field">
            <input type="checkbox" id="positions" /> positions
          </label>
        </div>
        <div id="output" class="editor"></div>
        <ul id="report" class="report" aria-live="polite"></ul>
      </section>
    </main>
  </body>
</html>
